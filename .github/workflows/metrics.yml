name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch: {}
  push: {branches: ["main", "master"]}

jobs:
  generate-text-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate textual metrics and update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_USER: PhantomPixel-0418
        run: |
          python - <<'PY'
          import os, requests, re
          token = os.environ.get('GITHUB_TOKEN')
          user = os.environ.get('METRICS_USER')
          headers = {'Authorization': f'token {token}'} if token else {}
          u = requests.get(f'https://api.github.com/users/{user}', headers=headers).json()
          followers = u.get('followers', 0)
          public_repos = u.get('public_repos', 0)
          profile = u.get('html_url', f'https://github.com/{user}')
          # basic top languages across repos (best-effort)
          langs = {}
          page = 1
          while True:
              r = requests.get(f'https://api.github.com/users/{user}/repos?per_page=100&page={page}', headers=headers)
              repos = r.json()
              if not repos:
                  break
              for repo in repos:
                  if repo.get('language'):
                      langs[repo['language']] = langs.get(repo['language'], 0) + 1
              page += 1
          top_langs = ', '.join([k for k,_ in sorted(langs.items(), key=lambda x:-x[1])][:5]) or 'N/A'

          md = f"### GitHub Data\n\n- [Profile]({profile})\n- Followers: **{followers}**\n- Public repositories: **{public_repos}**\n- Top languages: **{top_langs}**\n"

          for path in ['README.md','README_en.md']:
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      s = f.read()
              except FileNotFoundError:
                  continue
              s_new = re.sub(r'<!-- METRICS START -->(.|\n)*?<!-- METRICS END -->', f'<!-- METRICS START -->\n{md}\n<!-- METRICS END -->', s)
              if s_new != s:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(s_new)
          PY
      - name: Commit README updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README_en.md || true
          if ! git diff --staged --quiet; then
            git commit -m "Replace SVG metrics with text metrics\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push
          fi